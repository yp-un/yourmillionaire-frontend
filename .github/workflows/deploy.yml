name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  NEXT_PUBLIC_DASHBOARD_URL: ${{ vars.NEXT_PUBLIC_DASHBOARD_URL }}
  VITE_YM_API_BASE_URL: ${{ vars.VITE_YM_API_BASE_URL }}
  VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
  VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
  VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
  VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}
  VITE_TAX_STRATEGY_URL: ${{ vars.VITE_TAX_STRATEGY_URL }}
  VITE_SYNC_STREAM_URL: ${{ vars.VITE_SYNC_STREAM_URL }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            landing:
              - 'apps/landing/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/deploy.yml'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/deploy.yml'

  build-landing:
    name: Build landing
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.landing == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck shared and landing
        run: bun --cwd packages/ui typecheck && bun --cwd apps/landing typecheck

      - name: Build landing
        run: bun run build:landing

      - name: Upload landing artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-out
          path: apps/landing/out
          if-no-files-found: error

  build-dashboard:
    name: Build dashboard
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck shared and dashboard
        run: bun --cwd packages/ui typecheck && bun --cwd apps/dashboard typecheck

      - name: Build dashboard
        run: bun run build:dashboard

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: apps/dashboard/dist
          if-no-files-found: error

  deploy-landing:
    name: Deploy landing
    needs:
      - changes
      - build-landing
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.landing == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      LANDING_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.LANDING_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Download landing artifact
        uses: actions/download-artifact@v4
        with:
          name: landing-out
          path: landing-out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy landing to S3
        run: aws s3 sync landing-out "s3://${{ secrets.LANDING_S3_BUCKET }}" --delete

      - name: Invalidate landing CloudFront
        if: ${{ env.LANDING_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "$LANDING_CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

  deploy-dashboard:
    name: Deploy dashboard
    needs:
      - changes
      - build-dashboard
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DASHBOARD_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.DASHBOARD_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy dashboard to S3
        run: aws s3 sync dashboard-dist "s3://${{ secrets.DASHBOARD_S3_BUCKET }}" --delete

      - name: Invalidate dashboard CloudFront
        if: ${{ env.DASHBOARD_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "$DASHBOARD_CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
